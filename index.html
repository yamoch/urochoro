<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>うろちょろメーカー</title>
    <style>
      :root {
        --cream: #fff8f3;
        --espresso: #65595a;
        --terracotta: #e8b7b1;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--cream);
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* キャンバスの背景画像・背景色用 */
      #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        background-size: cover;
        background-position: center;
        z-index: 1;
      }

      #draw-canvas {
        position: absolute;
        top: 0;
        left: 0;
        cursor: crosshair;
        background: transparent;
        z-index: 2;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 3300;
      }

      .interactive {
        pointer-events: auto;
      }

      header {
        background: transparent;
        padding: 2px 2px 6px;
        border-radius: 0;
        box-shadow: none;
        text-align: center;
      }

      h1 {
        font-size: 1.05rem;
        margin: 0 0 2px 0;
        color: var(--espresso);
      }

      p {
        font-size: 0.75rem;
        margin: 0;
        color: var(--espresso);
        opacity: 0.72;
      }

      /* ハンバーガーメニューボタン（右上） */
      #hamburger-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 3500;
        background: var(--cream);
        border: 1px solid var(--espresso);
        width: 44px;
        height: 44px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(74, 59, 50, 0.13);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        padding: 0;
      }

      #hamburger-btn span {
        display: block;
        width: 20px;
        height: 2px;
        background-color: var(--espresso);
        border-radius: 1px;
        transition: 0.3s;
      }

      /* メニューモーダル */
      #menu-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(74, 59, 50, 0.48);
        z-index: 3400;
        display: none;
        justify-content: center;
        align-items: center;
      }

      #menu-modal.open {
        display: flex;
      }

      .menu-content {
        background: var(--cream);
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(74, 59, 50, 0.22);
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 250px;
        text-align: center;
      }

      .menu-content h2 {
        margin: 0 0 10px 0;
        font-size: 1.2rem;
        color: var(--espresso);
      }

      .menu-btn {
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        padding: 12px 18px;
        font-size: 0.92rem;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: none;
        transition:
          background-color 0.2s,
          border-color 0.2s;
      }

      .menu-btn:hover {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
      }

      #close-menu-btn {
        background-color: transparent;
        color: var(--espresso);
      }

      /* おとなようモード画面 / 一覧画面 */
      #adult-mode-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: var(--cream);
        z-index: 4000;
        display: none;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #adult-mode-screen.open {
        display: flex;
      }

      .adult-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(74, 59, 50, 0.24);
        padding-bottom: 15px;
        flex-shrink: 0;
      }

      .adult-header h2 {
        margin: 0;
        color: var(--espresso);
        font-size: 1.1rem;
      }

      .adult-header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .adult-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-bottom: 30px;
      }

      .adult-card {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 14px;
        padding: 12px;
        border: 2px solid rgba(74, 59, 50, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: relative;
        cursor: pointer;
      }

      .adult-card.selected {
        border-color: var(--espresso);
        background: rgba(232, 183, 177, 0.3);
      }

      .adult-card input[type="checkbox"] {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 20px;
        height: 20px;
        accent-color: var(--espresso);
        cursor: pointer;
        z-index: 2;
      }

      .adult-card img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        border: 1px solid rgba(74, 59, 50, 0.2);
        border-radius: 8px;
        background: #fff;
      }

      .download-btn-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }

      .download-btn {
        width: 100%;
        padding: 6px 0;
        font-size: 0.75rem;
        border-radius: 6px;
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        cursor: pointer;
      }

      .download-btn.jpg {
        background-color: var(--terracotta);
        color: var(--espresso);
        border-color: var(--terracotta);
      }

      /* 左側ツールバー */
      #drawing-toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        bottom: 12px;
        z-index: 3200;
        width: 290px;
        padding: 10px 12px;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-radius: 18px;
        background: rgba(246, 240, 231, 0.96);
        border: 1px solid rgba(74, 59, 50, 0.16);
        box-shadow: 0 8px 24px rgba(74, 59, 50, 0.12);
        transition:
          transform 0.3s ease,
          width 0.3s ease,
          padding 0.3s ease;
      }

      .toolbar-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        flex-grow: 1;
      }

      /* ツールバー折りたたみ用トグルボタン（PC用） */
      #toggle-toolbar-btn {
        background-color: var(--terracotta);
        color: var(--espresso);
        border: 1px solid var(--espresso);
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        -webkit-tap-highlight-color: transparent;
      }

      #drawing-toolbar.closed-pc {
        transform: none;
        left: 8px;
        top: 12px;
        bottom: auto;
        width: 46px !important;
        height: 46px;
        padding: 0 !important;
        overflow: visible !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        z-index: 3200;
      }

      #drawing-toolbar.closed-pc .toolbar-body,
      #drawing-toolbar.closed-pc header {
        display: none !important;
      }

      #drawing-toolbar.closed-pc #toggle-toolbar-btn {
        position: relative;
        inset: auto;
        width: 46px;
        height: 46px;
        margin: 0;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(74, 59, 50, 0.2);
      }

      #drawing-toolbar header {
        padding-left: 36px;
        padding-right: 5px;
      }

      .tool-section {
        padding: 6px 0;
        border-top: 1px solid rgba(74, 59, 50, 0.16);
      }

      .tool-section-title {
        display: block;
        margin-bottom: 4px;
        color: var(--espresso);
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.05em;
      }

      .btn-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .wide-btn {
        grid-column: 1 / -1;
      }

      button {
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        padding: 8px 6px;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.1s,
          background-color 0.2s,
          border-color 0.2s;
      }

      button:not(.color-btn):not(.bg-color-btn):hover {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
        color: var(--espresso);
      }
      button:active {
        transform: scale(0.95);
      }

      button:focus-visible {
        outline: 3px solid var(--terracotta);
        outline-offset: 2px;
      }

      #save-btn,
      #start-btn {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
        color: var(--espresso);
      }
      #save-btn:hover,
      #start-btn:hover {
        background-color: var(--espresso);
        border-color: var(--espresso);
        color: var(--cream);
      }
      #reset-btn {
        background-color: transparent;
        color: var(--espresso);
      }

      .draw-mode-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 4px;
        padding: 2px;
        border: 1px solid rgba(101, 89, 90, 0.16);
        border-radius: 10px;
        background: rgba(232, 183, 177, 0.18);
      }

      .draw-mode-btn {
        background: transparent;
        color: var(--espresso);
        border-color: transparent;
        box-shadow: none;
        padding: 5px;
      }

      .draw-mode-btn.is-active {
        background: var(--cream);
        color: var(--espresso);
        border-color: rgba(101, 89, 90, 0.14);
        box-shadow: 0 2px 6px rgba(101, 89, 90, 0.12);
      }

      .color-palette {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        padding: 2px;
      }

      .color-btn,
      .bg-color-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--cream);
        box-shadow: 0 1px 3px rgba(74, 59, 50, 0.22);
        cursor: pointer;
        padding: 0;
        transition: transform 0.1s;
      }

      .color-btn:active,
      .bg-color-btn:active {
        transform: scale(0.9);
      }
      .color-btn.active,
      .bg-color-btn.active {
        border-color: var(--espresso);
        transform: scale(1.1);
      }
      .color-btn.white-color,
      .bg-color-btn.white-color {
        border-color: rgba(74, 59, 50, 0.48);
      }
      .color-btn.white-color.active,
      .bg-color-btn.white-color.active {
        border-color: var(--espresso);
      }

      .fill-cursor {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="%23e8b7b1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-9 9 9 9 8-8z"></path><path d="M22 22l-5-5"></path></svg>')
            0 24,
          auto !important;
      }

      /* ほぞんした えの せんたくぱれっと */
      #library-container {
        background: rgba(255, 255, 255, 0.32);
        padding: 5px;
        border-radius: 8px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        max-height: 110px;
        overflow-y: auto;
        min-height: 50px;
        border: 1px solid rgba(74, 59, 50, 0.16);
      }

      .library-wrapper {
        position: relative;
        display: block;
        min-width: 0;
      }

      .library-item {
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        border: 1px solid rgba(101, 89, 90, 0.35);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.46);
        object-fit: contain;
      }

      .lib-action-btns {
        position: absolute;
        top: -5px;
        right: -5px;
        display: none;
        gap: 2px;
        z-index: 10;
      }

      .library-wrapper:hover .lib-action-btns,
      .library-wrapper:active .lib-action-btns {
        display: flex;
      }

      .lib-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .lib-edit-btn {
        background-color: var(--espresso);
      }
      .lib-del-btn {
        background-color: var(--terracotta);
        color: var(--espresso);
      }

      .library-placeholder {
        font-size: 0.65rem;
        color: var(--espresso);
        opacity: 0.62;
        text-align: center;
        width: 100%;
        grid-column: 1 / -1;
        align-self: center;
      }

      .wandering-creature {
        position: absolute;
        will-change: transform;
        z-index: 9999;
        pointer-events: none;
        transform-origin: center bottom;
      }

      /* スマホ対応レスポンシブ調整 */
      @media (max-width: 768px) {
        #drawing-toolbar {
          top: auto;
          right: max(8px, env(safe-area-inset-right));
          left: max(8px, env(safe-area-inset-left));
          bottom: max(8px, env(safe-area-inset-bottom));
          width: auto;
          max-height: min(52vh, 420px);
          padding: 8px 10px;
          border-radius: 16px;
          display: flex;
          flex-direction: column;
          transform: none !important;
        }

        #drawing-toolbar.closed-mobile {
          max-height: 44px !important;
          max-width: 44px !important;
          min-height: 0 !important;
          width: 44px !important;
          height: 44px !important;
          overflow: visible !important;
          padding: 0 !important;
          left: auto !important;
          right: max(8px, env(safe-area-inset-right)) !important;
          bottom: max(8px, env(safe-area-inset-bottom)) !important;
          top: auto !important;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          z-index: 3200;
        }
        #drawing-toolbar.closed-mobile .toolbar-body,
        #drawing-toolbar.closed-mobile header {
          display: none !important;
        }
        #drawing-toolbar.closed-mobile #toggle-toolbar-btn {
          top: auto !important;
          right: 0 !important;
          left: auto !important;
          bottom: 0 !important;
          width: 44px !important;
          height: 44px !important;
          border-radius: 12px;
          box-shadow: 0 3px 10px rgba(74, 59, 50, 0.2);
        }

        #drawing-toolbar header {
          order: -1;
          margin-bottom: 2px;
          padding-left: 5px;
          padding-right: 42px;
        }

        #toggle-toolbar-btn {
          top: 8px;
          right: 8px;
          left: auto;
        }

        .color-palette {
          grid-template-columns: repeat(6, 1fr);
        }
        .color-btn,
        .bg-color-btn {
          width: 24px;
          height: 24px;
        }
        #library-container {
          max-height: 90px;
        }
        .library-item {
          height: 42px;
        }
        #hamburger-btn {
          top: 10px;
          right: 60px;
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 右上ハンバーガーメニューボタン -->
    <button id="hamburger-btn" aria-label="メニュー">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- ハンバーガーメニューモーダル -->
    <div id="menu-modal">
      <div class="menu-content">
        <h2>もーど せんたく</h2>
        <button class="menu-btn" id="to-draw-mode">おえかき</button>
        <button class="menu-btn" id="to-adult-mode">おとなようモード</button>
        <button class="menu-btn" id="close-menu-btn">とじる</button>
      </div>
    </div>

    <!-- おとなようモード / 一覧画面 -->
    <div id="adult-mode-screen">
      <div class="adult-header">
        <h2 id="gallery-title-text">保存した絵のギャラリー</h2>
        <div class="adult-header-actions">
          <div id="adult-batch-download-container"></div>
          <button id="close-adult-mode">もどる</button>
        </div>
      </div>
      <div id="adult-gallery" class="adult-gallery"></div>
    </div>

    <!-- キャンバス背景＆描画キャンバス -->
    <div id="canvas-bg"></div>
    <canvas id="draw-canvas"></canvas>

    <div id="ui-layer">
      <aside
        id="drawing-toolbar"
        class="interactive"
        aria-label="おえかきツール"
      >
        <!-- アコーディオン開閉用ボタン -->
        <button
          id="toggle-toolbar-btn"
          type="button"
          aria-expanded="true"
          aria-controls="toolbar-body"
          aria-label="おえかきツールをとじる"
          title="おえかきツールをとじる"
        >
          ◀
        </button>

        <!-- アプリ名ヘッダー -->
        <header>
          <h1>うろちょろメーカー</h1>
          <p>かく、ほぞんする、うごかす</p>
        </header>

        <div class="toolbar-body" id="toolbar-body">
          <section class="tool-section" aria-labelledby="draw-tools-title">
            <span id="draw-tools-title" class="tool-section-title"
              >1. かく</span
            >
            <div
              class="draw-mode-switch"
              role="group"
              aria-label="えがきかたをえらぶ"
            >
              <button
                id="pen-btn"
                class="draw-mode-btn is-active"
                type="button"
                aria-pressed="true"
              >
                ペン
              </button>
              <button
                id="fill-btn"
                class="draw-mode-btn"
                type="button"
                aria-pressed="false"
              >
                ぬりつぶし
              </button>
            </div>
            <div class="color-palette" aria-label="いろをえらぶ">
              <button
                class="color-btn active"
                data-color="#000000"
                style="background-color: #000000"
                title="くろ"
                aria-label="くろ"
              ></button>
              <button
                class="color-btn white-color"
                data-color="#ffffff"
                style="background-color: #ffffff"
                title="しろ"
                aria-label="しろ"
              ></button>
              <button
                class="color-btn"
                data-color="#9e9e9e"
                style="background-color: #9e9e9e"
                title="はいいろ"
                aria-label="はいいろ"
              ></button>
              <button
                class="color-btn"
                data-color="#930028"
                style="background-color: #930028"
                title="あか"
                aria-label="あか"
              ></button>
              <button
                class="color-btn"
                data-color="#E0859D"
                style="background-color: #e0859d"
                title="ぴんく"
                aria-label="ぴんく"
              ></button>
              <button
                class="color-btn"
                data-color="#54443C"
                style="background-color: #54443c"
                title="ちゃいろ"
                aria-label="ちゃいろ"
              ></button>
              <button
                class="color-btn"
                data-color="#FF9203"
                style="background-color: #ff9203"
                title="おれんじ"
                aria-label="おれんじ"
              ></button>
              <button
                class="color-btn"
                data-color="#ECC600"
                style="background-color: #ecc600"
                title="きいろ"
                aria-label="きいろ"
              ></button>
              <button
                class="color-btn"
                data-color="#008152"
                style="background-color: #008152"
                title="みどり"
                aria-label="みどり"
              ></button>
              <button
                class="color-btn"
                data-color="#87B0E5"
                style="background-color: #87b0e5"
                title="みずいろ"
                aria-label="みずいろ"
              ></button>
              <button
                class="color-btn"
                data-color="#00488B"
                style="background-color: #00488b"
                title="あお"
                aria-label="あお"
              ></button>
              <button
                class="color-btn"
                data-color="#7C4C92"
                style="background-color: #7c4c92"
                title="むらさき"
                aria-label="むらさき"
              ></button>
            </div>
            <div class="btn-container" style="margin-top: 4px">
              <button id="undo-btn">もどる</button>
              <button id="clear-btn">いまのえを けす</button>
            </div>
          </section>

          <section class="tool-section" aria-labelledby="save-tools-title">
            <span id="save-tools-title" class="tool-section-title"
              >2. ほぞんする</span
            >
            <div class="btn-container">
              <button id="save-btn">えを ほぞん</button>
              <button id="open-gallery-btn">いちらんを みる</button>
            </div>
          </section>

          <section class="tool-section" aria-labelledby="library-title">
            <span id="library-title" class="tool-section-title"
              >ほぞんした え</span
            >
            <div id="library-container">
              <span class="library-placeholder">まだ えが ないよ</span>

    <script>
      const canvas = document.getElementById("draw-canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const canvasBg = document.getElementById("canvas-bg");
      const startBtn = document.getElementById("start-btn");
      const clearBtn = document.getElementById("clear-btn");
      const undoBtn = document.getElementById("undo-btn");
      const saveBtn = document.getElementById("save-btn");
      const stopBtn = document.getElementById("stop-btn");
      const screenResetBtn = document.getElementById("screen-reset-btn");
      const penBtn = document.getElementById("pen-btn");
      const fillBtn = document.getElementById("fill-btn");
      const libraryContainer = document.getElementById("library-container");
      const colorBtns = document.querySelectorAll(".color-btn");

      // 背景変更用の要素
      const bgColorBtns = document.querySelectorAll(".bg-color-btn");
      const selectBgPhotoBtn = document.getElementById("select-bg-photo-btn");
      const bgFileInput = document.getElementById("bg-file-input");

      // ツールバー折りたたみ関連要素
      const drawingToolbar = document.getElementById("drawing-toolbar");
      const toggleToolbarBtn = document.getElementById("toggle-toolbar-btn");
      let isToolbarOpen = true;

      function updateToolbarToggleUI() {
        const isMobile = window.innerWidth <= 768;

        drawingToolbar.classList.remove("closed-pc", "closed-mobile");

        if (isToolbarOpen) {
          toggleToolbarBtn.textContent = isMobile ? "▼" : "◀";
          toggleToolbarBtn.setAttribute("aria-label", "おえかきツールをとじる");
          toggleToolbarBtn.setAttribute("title", "おえかきツールをとじる");
          toggleToolbarBtn.setAttribute("aria-expanded", "true");
        } else {
          drawingToolbar.classList.add(
            isMobile ? "closed-mobile" : "closed-pc",
          );
          toggleToolbarBtn.textContent = isMobile ? "▲" : "▶";
          toggleToolbarBtn.setAttribute("aria-label", "おえかきツールをひらく");
          toggleToolbarBtn.setAttribute("title", "おえかきツールをひらく");
          toggleToolbarBtn.setAttribute("aria-expanded", "false");
        }
      }

      toggleToolbarBtn.addEventListener("click", () => {
        isToolbarOpen = !isToolbarOpen;
        updateToolbarToggleUI();
      });

      window.addEventListener("resize", updateToolbarToggleUI);
      updateToolbarToggleUI();

      // ハンバーガーメニュー & ギャラリー関連要素
      const hamburgerBtn = document.getElementById("hamburger-btn");
      const menuModal = document.getElementById("menu-modal");
      const closeMenuBtn = document.getElementById("close-menu-btn");
      const toDrawModeBtn = document.getElementById("to-draw-mode");
      const openGalleryBtn = document.getElementById("open-gallery-btn");
      const toAdultModeBtn = document.getElementById("to-adult-mode");
      const adultModeScreen = document.getElementById("adult-mode-screen");
      const closeAdultModeBtn = document.getElementById("close-adult-mode");
      const adultGallery = document.getElementById("adult-gallery");
      const galleryTitleText = document.getElementById("gallery-title-text");
      const adultBatchDownloadContainer = document.getElementById(
        "adult-batch-download-container",
      );

      let creatures = [];
      let currentColor = "#000000";
      let isFillMode = false;
      let isPaused = false;

      let undoStack = [];
      const maxUndoSteps = 20;

      function saveState() {
        if (undoStack.length >= maxUndoSteps) {
          undoStack.shift();
        }
        undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      }

      hamburgerBtn.addEventListener("click", () => {
        menuModal.classList.add("open");
      });

      closeMenuBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
      });

      toDrawModeBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
        adultModeScreen.classList.remove("open");
      });

      function openGalleryView() {
        menuModal.classList.remove("open");
        galleryTitleText.textContent = "保存した絵の一覧";
        renderAdultGallery(true);
        adultModeScreen.classList.add("open");
      }

      openGalleryBtn.addEventListener("click", openGalleryView);

      toAdultModeBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
        galleryTitleText.textContent = "おとなようモード（画像保存管理）";
        renderAdultGallery(false);
        adultModeScreen.classList.add("open");
      });

      closeAdultModeBtn.addEventListener("click", () => {
        adultModeScreen.classList.remove("open");
      });

      function renderAdultGallery(isSimpleList = false) {
        adultGallery.innerHTML = "";
        adultBatchDownloadContainer.innerHTML = "";
        const images = readSavedImages();
        if (images.length === 0) {
          adultGallery.innerHTML =
            '<p style="grid-column: 1/-1; text-align: center; color: #666;">保存された絵がまだありません。</p>';
          return;
        }

        if (!isSimpleList && images.length > 0) {
          const batchGroup = document.createElement("div");
          batchGroup.style.display = "flex";
          batchGroup.style.gap = "8px";
          batchGroup.style.flexWrap = "wrap";

          const selectAllBtn = document.createElement("button");
          selectAllBtn.textContent = "すべて選択";
          selectAllBtn.className = "download-btn";
          selectAllBtn.style.padding = "6px 12px";
          let isAllSelected = false;
          selectAllBtn.addEventListener("click", () => {
            const checkboxes = adultGallery.querySelectorAll(
              "input[type='checkbox']",
            );
            const cards = adultGallery.querySelectorAll(".adult-card");
            isAllSelected = !isAllSelected;
            checkboxes.forEach((cb, idx) => {
              cb.checked = isAllSelected;
              if (isAllSelected) {
                cards[idx].classList.add("selected");
              } else {
                cards[idx].classList.remove("selected");
              }
            });
            selectAllBtn.textContent = isAllSelected
              ? "すべて解除"
              : "すべて選択";
          });

          const batchPngBtn = document.createElement("button");
          batchPngBtn.textContent = "選択した絵をPNGで保存";
          batchPngBtn.className = "download-btn";
          batchPngBtn.style.padding = "6px 12px";
          batchPngBtn.addEventListener("click", () => {
            const checkboxes = adultGallery.querySelectorAll(
              "input[type='checkbox']",
            );
            let count = 0;
            checkboxes.forEach((cb, idx) => {
              if (cb.checked) {
                count++;
                downloadImage(images[idx].dataUrl, `illust_${idx + 1}.png`);
              }
            });
            if (count === 0) alert("保存する絵が選択されていません。");
          });

          const batchJpgBtn = document.createElement("button");
          batchJpgBtn.textContent = "選択した絵をJPGで保存";
          batchJpgBtn.className = "download-btn jpg";
          batchJpgBtn.style.padding = "6px 12px";
          batchJpgBtn.addEventListener("click", () => {
            const checkboxes = adultGallery.querySelectorAll(
              "input[type='checkbox']",
            );
            let count = 0;
            checkboxes.forEach((cb, idx) => {
              if (cb.checked) {
                count++;
                const imgInfo = images[idx];
                const tempCanvas = document.createElement("canvas");
                tempCanvas.width = imgInfo.width;
                tempCanvas.height = imgInfo.height;
                const tCtx = tempCanvas.getContext("2d");
                tCtx.fillStyle = "#ffffff";
                tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                const sourceImg = new Image();
                sourceImg.src = imgInfo.dataUrl;
                sourceImg.onload = () => {
                  tCtx.drawImage(sourceImg, 0, 0);
                  const jpgDataUrl = tempCanvas.toDataURL("image/jpeg", 0.9);
                  downloadImage(jpgDataUrl, `illust_${idx + 1}.jpg`);
                };
              }
            });
            if (count === 0) alert("保存する絵が選択されていません。");
          });

          batchGroup.appendChild(selectAllBtn);
          batchGroup.appendChild(batchPngBtn);
          batchGroup.appendChild(batchJpgBtn);
          adultBatchDownloadContainer.appendChild(batchGroup);
        }

        images.forEach((imgInfo, index) => {
          const card = document.createElement("div");
          card.className = "adult-card";

          let checkbox = null;
          if (!isSimpleList) {
            checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.addEventListener("change", (e) => {
              e.stopPropagation();
              if (checkbox.checked) {
                card.classList.add("selected");
              } else {
                card.classList.remove("selected");
              }
            });
            card.addEventListener("click", (e) => {
              if (e.target !== checkbox) {
                checkbox.checked = !checkbox.checked;
                checkbox.dispatchEvent(new Event("change"));
              }
            });
            card.appendChild(checkbox);
          }

          const img = document.createElement("img");
          img.src = imgInfo.dataUrl;
          card.appendChild(img);

          if (isSimpleList) {
            const btnGroup = document.createElement("div");
            btnGroup.className = "download-btn-group";

            const spawnBtn = document.createElement("button");
            spawnBtn.className = "download-btn";
            spawnBtn.textContent = "うごかす！";
            spawnBtn.addEventListener("click", () => {
              spawnCreature(imgInfo.dataUrl, imgInfo.width, imgInfo.height);
              adultModeScreen.classList.remove("open");
            });

            const delBtn = document.createElement("button");
            delBtn.className = "download-btn jpg";
            delBtn.textContent = "さくじょ";
            delBtn.addEventListener("click", () => {
              if (window.confirm("この絵を削除しますか？")) {
                images.splice(index, 1);
                saveImagesToStorageAll(images);
                refreshAllLibraries();
                renderAdultGallery(true);
              }
            });

            btnGroup.appendChild(spawnBtn);
            btnGroup.appendChild(delBtn);
            card.appendChild(btnGroup);
          } else {
            const btnGroup = document.createElement("div");
            btnGroup.className = "download-btn-group";

            const pngBtn = document.createElement("button");
            pngBtn.className = "download-btn";
            pngBtn.textContent = "PNG保存";
            pngBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              downloadImage(imgInfo.dataUrl, `illust_${index + 1}.png`);
            });

            const jpgBtn = document.createElement("button");
            jpgBtn.className = "download-btn jpg";
            jpgBtn.textContent = "JPG保存";
            jpgBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              const tempCanvas = document.createElement("canvas");
              tempCanvas.width = imgInfo.width;
              tempCanvas.height = imgInfo.height;
              const tCtx = tempCanvas.getContext("2d");

              tCtx.fillStyle = "#ffffff";
              tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

              const sourceImg = new Image();
              sourceImg.src = imgInfo.dataUrl;
              sourceImg.onload = () => {
                tCtx.drawImage(sourceImg, 0, 0);
                const jpgDataUrl = tempCanvas.toDataURL("image/jpeg", 0.9);
                downloadImage(jpgDataUrl, `illust_${index + 1}.jpg`);
              };
            });

            btnGroup.appendChild(pngBtn);
            btnGroup.appendChild(jpgBtn);
            card.appendChild(btnGroup);
          }

          adultGallery.appendChild(card);
        });
      }

      function downloadImage(dataUrl, filename) {
        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      /* ペン用カラーパレットの操作 */
      colorBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          colorBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentColor = btn.getAttribute("data-color");
          ctx.strokeStyle = currentColor;
          ctx.fillStyle = currentColor;
        });
      });

      /* 背景色用パレットの操作 */
      bgColorBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          bgColorBtns.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const bgCol = btn.getAttribute("data-color");
          canvasBg.style.backgroundImage = "none";
          canvasBg.style.backgroundColor = bgCol;
        });
      });

      /* 外部ファイル（写真）を背景にする操作 */
      selectBgPhotoBtn.addEventListener("click", () => {
        bgFileInput.click();
      });

      bgFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const imageUrl = event.target.result;
          canvasBg.style.backgroundColor = "transparent";
          canvasBg.style.backgroundImage = `url('${imageUrl}')`;

          // 背景色パレットの選択状態を解除
          bgColorBtns.forEach((b) => b.classList.remove("active"));
        };
        reader.readAsDataURL(file);
        // 同じファイルを再度選択できるようにリセット
        bgFileInput.value = "";
      });

      function resizeCanvas() {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        if (canvas.width > 0 && canvas.height > 0) {
          tempCtx.drawImage(canvas, 0, 0);
        }

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        ctx.drawImage(tempCanvas, 0, 0);
        ctx.strokeStyle = currentColor;
        ctx.fillStyle = currentColor;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (undoStack.length === 0) {
          saveState();
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function getEventPos(e) {
        const touch = e.touches && e.touches.length > 0 ? e.touches[0] : null;
        const clientX = Number.isFinite(e.clientX)
          ? e.clientX
          : touch
            ? touch.clientX
            : null;
        const clientY = Number.isFinite(e.clientY)
          ? e.clientY
          : touch
            ? touch.clientY
            : null;
        return { x: clientX, y: clientY };
      }

      function handleCanvasDown(e) {
        const pos = getEventPos(e);
        if (!Number.isFinite(pos.x) || !Number.isFinite(pos.y)) return;

        saveState();

        if (isFillMode) {
          e.preventDefault();
          floodFill(Math.floor(pos.x), Math.floor(pos.y), currentColor);
        } else {
          isDrawing = true;
          [lastX, lastY] = [pos.x, pos.y];
        }
      }

      function handleCanvasMove(e) {
        if (!isDrawing || isFillMode) return;
        e.preventDefault();

        const pos = getEventPos(e);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        [lastX, lastY] = [pos.x, pos.y];
      }

      function stopDrawing() {
        isDrawing = false;
      }

      function floodFill(startX, startY, fillColorHex) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const targetColor = getPixel(data, startX, startY, canvas.width);
        const fillColor = hexToRgba(fillColorHex);

        if (colorsMatch(targetColor, fillColor)) return;

        const queue = [[startX, startY]];
        const width = canvas.width;
        const height = canvas.height;

        while (queue.length > 0) {
          const [x, y] = queue.pop();

          if (x < 0 || x >= width || y < 0 || y >= height) continue;

          const currentColorAtPixel = getPixel(data, x, y, width);
          if (colorsMatch(currentColorAtPixel, targetColor)) {
            setPixel(data, x, y, width, fillColor);
            queue.push([x + 1, y]);
            queue.push([x - 1, y]);
            queue.push([x, y + 1]);
            queue.push([x, y - 1]);
          }
        }

        ctx.putImageData(imgData, 0, 0);
      }

      function getPixel(data, x, y, width) {
        const index = (y * width + x) * 4;
        return [data[index], data[index + 1], data[index + 2], data[index + 3]];
      }

      function setPixel(data, x, y, width, color) {
        const index = (y * width + x) * 4;
        data[index] = color[0];
        data[index + 1] = color[1];
        data[index + 2] = color[2];
        data[index + 3] = color[3];
      }

      function colorsMatch(a, b) {
        return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
      }

      function hexToRgba(hex) {
        let c = hex.replace("#", "");
        if (c.length === 3)
          c = c
            .split("")
            .map((x) => x + x)
            .join("");
        const num = parseInt(c, 16);
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
      }

      canvas.addEventListener("mousedown", handleCanvasDown);
      canvas.addEventListener("mousemove", handleCanvasMove);
      canvas.addEventListener("mouseup", stopDrawing);
      canvas.addEventListener("mouseout", stopDrawing);
      canvas.addEventListener("touchstart", handleCanvasDown, {
        passive: false,
      });
      canvas.addEventListener("touchmove", handleCanvasMove, {
        passive: false,
      });
      canvas.addEventListener("touchend", stopDrawing);

      undoBtn.addEventListener("click", () => {
        if (undoStack.length > 1) {
          undoStack.pop();
          const previousState = undoStack[undoStack.length - 1];
          ctx.putImageData(previousState, 0, 0);
        } else if (undoStack.length === 1) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          saveState();
        }
      });

      clearBtn.addEventListener("click", () => {
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      penBtn.addEventListener("click", () => {
        isFillMode = false;
        penBtn.classList.add("is-active");
        fillBtn.classList.remove("is-active");
        canvas.classList.remove("fill-cursor");
      });

      fillBtn.addEventListener("click", () => {
        isFillMode = true;
        fillBtn.classList.add("is-active");
        penBtn.classList.remove("is-active");
        canvas.classList.add("fill-cursor");
      });

      function getCroppedImage() {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        let minX = canvas.width,
          minY = canvas.height,
          maxX = 0,
          maxY = 0;
        let found = false;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const alpha = data[(y * canvas.width + x) * 4 + 3];
            if (alpha > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }

        if (!found) return null;

        const padding = 10;
        minX = Math.max(0, minX - padding);
        minY = Math.max(0, minY - padding);
        maxX = Math.min(canvas.width, maxX + padding);
        maxY = Math.min(canvas.height, maxY + padding);

        const width = maxX - minX;
        const height = maxY - minY;

        if (width < 2 || height < 2) return null;

        const cutCanvas = document.createElement("canvas");
        cutCanvas.width = width;
        cutCanvas.height = height;
        const cutCtx = cutCanvas.getContext("2d");
        cutCtx.drawImage(
          canvas,
          minX,
          minY,
          width,
          height,
          0,
          0,
          width,
          height,
        );

        return {
          dataUrl: cutCanvas.toDataURL(),
          width: width,
          height: height,
        };
      }

      function readSavedImages() {
        const saved = localStorage.getItem("wandering_creatures");
        if (!saved) return [];

        try {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) return [];

          return parsed
            .filter((imgInfo) => {
              if (!imgInfo || typeof imgInfo !== "object") return false;
              if (
                typeof imgInfo.dataUrl !== "string" ||
                !imgInfo.dataUrl.startsWith("data:image/")
              )
                return false;
              if (
                !Number.isFinite(Number(imgInfo.width)) ||
                !Number.isFinite(Number(imgInfo.height))
              )
                return false;
              if (Number(imgInfo.width) <= 0 || Number(imgInfo.height) <= 0)
                return false;
              if (
                Number(imgInfo.width) > 10000 ||
                Number(imgInfo.height) > 10000
              )
                return false;
              return true;
            })
            .map((imgInfo) => ({
              dataUrl: imgInfo.dataUrl,
              width: Number(imgInfo.width),
              height: Number(imgInfo.height),
            }));
        } catch (error) {
          console.warn("保存データを読み込めませんでした。", error);
          return [];
        }
      }

      function loadSavedImages() {
        libraryContainer.innerHTML =
          '<span class="library-placeholder">まだ えが ないよ</span>';
        const images = readSavedImages();
        images.forEach((imgInfo) => {
          addThumbnailToLibrary(imgInfo);
        });
      }

      function refreshAllLibraries() {
        libraryContainer.innerHTML =
          '<span class="library-placeholder">まだ えが ないよ</span>';
        const images = readSavedImages();
        images.forEach((imgInfo) => {
          addThumbnailToLibrary(imgInfo);
        });
      }

      function saveImagesToStorageAll(images) {
        try {
          localStorage.setItem("wandering_creatures", JSON.stringify(images));
          return true;
        } catch (error) {
          console.error("保存領域への書き込みに失敗しました。", error);
          alert(
            "えの保存に失敗しました。保存できる量をこえている可能性があります。",
          );
          return false;
        }
      }

      function addThumbnailToLibrary(imgInfo) {
        const placeholder = libraryContainer.querySelector(
          ".library-placeholder",
        );
        if (placeholder) placeholder.remove();

        const wrapper = document.createElement("div");
        wrapper.className = "library-wrapper";

        const thumb = document.createElement("img");
        thumb.src = imgInfo.dataUrl;
        thumb.className = "library-item";
        thumb.title = "くりっくしてだす";

        thumb.style.objectFit = "contain";
        thumb.style.aspectRatio = `${imgInfo.width} / ${imgInfo.height}`;

        thumb.addEventListener("click", () => {
          spawnCreature(imgInfo.dataUrl, imgInfo.width, imgInfo.height);
        });

        const actionBtns = document.createElement("div");
        actionBtns.className = "lib-action-btns";

        const editBtn = document.createElement("button");
        editBtn.className = "lib-btn lib-edit-btn";
        editBtn.textContent = "✏️";
        editBtn.title = "えんぴつでなおす";
        editBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const img = new Image();
          img.src = imgInfo.dataUrl;
          img.onload = () => {
            saveState();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const drawX = (canvas.width - img.width) / 2;
            const drawY = (canvas.height - img.height) / 2;
            ctx.drawImage(img, drawX, drawY);
            saveState();
          };
        });

        const delBtn = document.createElement("button");
        delBtn.className = "lib-btn lib-del-btn";
        delBtn.textContent = "❌";
        delBtn.title = "このえを消す";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const ok = window.confirm("このえを さくじょ しますか？");
          if (ok) {
            wrapper.remove();
            updateStorageAfterDelete();
            if (
              libraryContainer.querySelectorAll(".library-wrapper").length === 0
            ) {
              libraryContainer.innerHTML =
                '<span class="library-placeholder">まだ えが ないよ</span>';
            }
          }
        });

        actionBtns.appendChild(editBtn);
        actionBtns.appendChild(delBtn);

        wrapper.appendChild(thumb);
        wrapper.appendChild(actionBtns);
        libraryContainer.appendChild(wrapper);
      }

      function updateStorageAfterDelete() {
        const wrappers = libraryContainer.querySelectorAll(".library-wrapper");
        const newImages = [];
        wrappers.forEach((w) => {
          const img = w.querySelector(".library-item");
          newImages.push({
            dataUrl: img.src,
            width: img.naturalWidth || 100,
            height: img.naturalHeight || 100,
          });
        });
        saveImagesToStorageAll(newImages);
      }

      saveBtn.addEventListener("click", () => {
        const imgInfo = getCroppedImage();
        if (!imgInfo) {
          alert("ほぞんする え が ないよ！");
          return;
        }

        const images = readSavedImages();
        images.push(imgInfo);
        if (!saveImagesToStorageAll(images)) return;

        addThumbnailToLibrary(imgInfo);
        saveState();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      let activeCreatures = [];

      function spawnCreature(
        dataUrl,
        origWidth,
        origHeight,
        customX,
        customY,
        customSpeedX,
        customSpeedY,
      ) {
        const creature = document.createElement("img");
        creature.src = dataUrl;
        creature.className = "wandering-creature";

        const baseSize = 90;
        let width, height;
        if (origWidth >= origHeight) {
          width = baseSize;
          height = baseSize * (origHeight / origWidth);
        } else {
          height = baseSize;
          width = baseSize * (origWidth / origHeight);
        }

        creature.style.width = width + "px";
        creature.style.height = height + "px";
        creature.style.objectFit = "contain";

        document.body.appendChild(creature);

        let posX =
          customX !== undefined
            ? customX
            : Math.random() * (window.innerWidth - width);
        let posY =
          customY !== undefined
            ? customY
            : Math.random() * (window.innerHeight - height);
        let speedX =
          customSpeedX !== undefined ? customSpeedX : (Math.random() - 0.5) * 6;
        let speedY =
          customSpeedY !== undefined ? customSpeedY : (Math.random() - 0.5) * 6;

        if (customSpeedX === undefined) {
          if (Math.abs(speedX) < 1) speedX = 2;
          if (Math.abs(speedY) < 1) speedY = 2;
        }

        let stepCount = Math.random() * 100;

        const creatureObj = {
          element: creature,
          dataUrl: dataUrl,
          origWidth: origWidth,
          origHeight: origHeight,
          get x() {
            return posX;
          },
          set x(val) {
            posX = val;
          },
          get y() {
            return posY;
          },
          set y(val) {
            posY = val;
          },
          get width() {
            return width;
          },
          get height() {
            return height;
          },
          get speedX() {
            return speedX;
          },
          set speedX(val) {
            speedX = val;
          },
          get speedY() {
            return speedY;
          },
          set speedY(val) {
            speedY = val;
          },
          isRunning: !isPaused,
          animationId: null,
          remove: function () {
            this.isRunning = false;
            if (this.animationId) cancelAnimationFrame(this.animationId);
            creature.remove();
          },
        };

        function animate() {
          if (!creatureObj.isRunning) return;

          posX += speedX;
          posY += speedY;
          stepCount += 0.2;

          let tiltAngle = Math.sin(stepCount) * 15;
          let scaleXFactor = speedX < 0 ? -1 : 1;

          if (posX <= 0 || posX + width >= window.innerWidth) {
            speedX *= -1;
            posX = Math.max(0, Math.min(posX, window.innerWidth - width));
          }
          if (posY <= 0 || posY + height >= window.innerHeight) {
            speedY *= -1;
            posY = Math.max(0, Math.min(posY, window.innerHeight - height));
          }

          for (let other of activeCreatures) {
            if (other === creatureObj || !other.isRunning) continue;

            if (
              posX < other.x + other.width &&
              posX + width > other.x &&
              posY < other.y + other.height &&
              posY + height > other.y
            ) {
              const tempSpeedX = speedX;
              const tempSpeedY = speedY;
              speedX = other.speedX;
              speedY = other.speedY;
              other.speedX = tempSpeedX;
              other.speedY = tempSpeedY;

              const dx = posX + width / 2 - (other.x + other.width / 2);
              const dy = posY + height / 2 - (other.y + other.height / 2);
              const pushDist = 3;
              posX += (dx !== 0 ? Math.sign(dx) : 1) * pushDist;
              posY += (dy !== 0 ? Math.sign(dy) : 1) * pushDist;
            }
          }

          creature.style.transform = `translate(${posX}px, ${posY}px) scaleX(${scaleXFactor}) rotate(${tiltAngle}deg)`;
          creatureObj.animationId = requestAnimationFrame(animate);
        }

        if (creatureObj.isRunning) {
          creatureObj.animationId = requestAnimationFrame(animate);
        } else {
          let scaleXFactor = speedX < 0 ? -1 : 1;
          creature.style.transform = `translate(${posX}px, ${posY}px) scaleX(${scaleXFactor}) rotate(0deg)`;
        }

        activeCreatures.push(creatureObj);
        creatures.push(creatureObj);
      }

      startBtn.addEventListener("click", () => {
        const thumbs = libraryContainer.querySelectorAll(".library-item");
        if (thumbs.length === 0) {
          alert("まずは えを かいて ほぞんしてね！");
          return;
        }

        thumbs.forEach((thumb) => {
          const img = new Image();
          img.src = thumb.src;
          img.onload = () => {
            spawnCreature(
              thumb.src,
              img.naturalWidth || img.width,
              img.naturalHeight || img.height,
            );
          };
        });
      });

      stopBtn.addEventListener("click", () => {
        if (!isPaused) {
          isPaused = true;
          creatures.forEach((c) => {
            c.isRunning = false;
            if (c.animationId) cancelAnimationFrame(c.animationId);
          });
          stopBtn.textContent = "さいかいする";
          stopBtn.style.backgroundColor = "var(--terracotta)";
          stopBtn.style.color = "var(--espresso)";
        } else {
          isPaused = false;
          creatures.forEach((c) => {
            c.isRunning = true;
            function resumeAnimate() {
              if (!c.isRunning) return;

              c.x += c.speedX;
              c.y += c.speedY;

              if (c.x <= 0 || c.x + c.width >= window.innerWidth) {
                c.speedX *= -1;
                c.x = c.x < 0 ? 0 : window.innerWidth - c.width;
              }
              if (c.y <= 0 || c.y + c.height >= window.innerHeight) {
                c.speedY *= -1;
                c.y = c.y < 0 ? c.y : window.innerHeight - c.height;
              }

              let scaleXFactor = c.speedX < 0 ? -1 : 1;
              c.element.style.transform = `translate(${c.x}px, ${c.y}px) scaleX(${scaleXFactor}) rotate(0deg)`;
              c.animationId = requestAnimationFrame(resumeAnimate);
            }
            c.animationId = requestAnimationFrame(resumeAnimate);
          });
          stopBtn.textContent = "とめる";
          stopBtn.style.backgroundColor = "var(--espresso)";
          stopBtn.style.color = "var(--cream)";
        }
      });

      screenResetBtn.addEventListener("click", () => {
        creatures.forEach((c) => c.remove());
        creatures = [];
        activeCreatures = [];
        if (isPaused) {
          isPaused = false;
          stopBtn.textContent = "とめる";
          stopBtn.style.backgroundColor = "var(--espresso)";
          stopBtn.style.color = "var(--cream)";
        }
      });

      loadSavedImages();
    </script>
  </body>
</html>
