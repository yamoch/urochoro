<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>うろちょろメーカー</title>
    <style>
      :root {
        --cream: #fff8f3;
        --espresso: #65595a;
        --terracotta: #e8b7b1;
      }

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--cream);
        font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
        background-size: cover;
        background-position: center;
        z-index: 1;
      }

      #draw-canvas {
        position: absolute;
        top: 0;
        left: 0;
        background: transparent;
        z-index: 2;
      }

      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        pointer-events: none;
        z-index: 3300;
      }

      .interactive {
        pointer-events: auto;
      }

      header {
        background: transparent;
        padding: 2px 2px 6px;
        border-radius: 0;
        box-shadow: none;
        text-align: center;
      }

      h1 {
        font-size: 1.05rem;
        margin: 0 0 2px 0;
        color: var(--espresso);
      }

      p {
        font-size: 0.75rem;
        margin: 0;
        color: var(--espresso);
        opacity: 0.72;
      }

      /* ハンバーガーメニューボタン（右上） */
      #hamburger-btn {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 3500;
        background: var(--cream);
        border: 1px solid var(--espresso);
        width: 44px;
        height: 44px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(74, 59, 50, 0.13);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        padding: 0;
      }

      #hamburger-btn span {
        display: block;
        width: 20px;
        height: 2px;
        background-color: var(--espresso);
        border-radius: 1px;
        transition: 0.3s;
      }

      /* メニューモーダル */
      #menu-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(74, 59, 50, 0.48);
        z-index: 3400;
        display: none;
        justify-content: center;
        align-items: center;
      }

      #menu-modal.open {
        display: flex;
      }

      .menu-content {
        background: var(--cream);
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(74, 59, 50, 0.22);
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 250px;
        text-align: center;
      }

      .menu-content h2 {
        margin: 0 0 10px 0;
        font-size: 1.2rem;
        color: var(--espresso);
      }

      .menu-btn {
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        padding: 12px 18px;
        font-size: 0.92rem;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: none;
        transition:
          background-color 0.2s,
          border-color 0.2s;
      }

      .menu-btn:hover {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
        color: var(--espresso);
      }

      #close-menu-btn {
        background-color: transparent;
        color: var(--espresso);
      }

      /* モーダル共通画面 */
      #adult-mode-screen,
      #battle-setup-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: var(--cream);
        z-index: 4000;
        display: none;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }

      #adult-mode-screen.open,
      #battle-setup-screen.open {
        display: flex;
      }

      .adult-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(74, 59, 50, 0.24);
        padding-bottom: 15px;
        flex-shrink: 0;
      }

      .adult-header h2 {
        margin: 0;
        color: var(--espresso);
        font-size: 1.1rem;
      }

      .adult-header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .adult-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding-bottom: 30px;
      }

      .adult-card {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 14px;
        padding: 12px;
        border: 2px solid rgba(74, 59, 50, 0.16);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        position: relative;
        cursor: pointer;
      }

      .adult-card.selected {
        border-color: var(--espresso);
        background: rgba(232, 183, 177, 0.3);
      }

      .adult-card input[type="checkbox"] {
        position: absolute;
        top: 10px;
        left: 10px;
        width: 20px;
        height: 20px;
        accent-color: var(--espresso);
        cursor: pointer;
        z-index: 2;
      }

      .adult-card img {
        width: 100px;
        height: 100px;
        object-fit: contain;
        border: 1px solid rgba(74, 59, 50, 0.2);
        border-radius: 8px;
        background: #fff;
      }

      .download-btn-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }

      .download-btn {
        width: 100%;
        padding: 6px 0;
        font-size: 0.75rem;
        border-radius: 6px;
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        cursor: pointer;
      }

      .download-btn.jpg {
        background-color: var(--terracotta);
        color: var(--espresso);
        border-color: var(--terracotta);
      }

      /* 左側ツールバー */
      #drawing-toolbar {
        position: fixed;
        top: 12px;
        left: 12px;
        bottom: 12px;
        z-index: 3200;
        width: 290px;
        padding: 10px 12px;
        box-sizing: border-box;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-radius: 18px;
        background: rgba(246, 240, 231, 0.96);
        border: 1px solid rgba(74, 59, 50, 0.16);
        box-shadow: 0 8px 24px rgba(74, 59, 50, 0.12);
        transition:
          transform 0.3s ease,
          width 0.3s ease,
          padding 0.3s ease;
      }

      #drawing-toolbar.battle-hidden {
        display: none !important;
      }

      .toolbar-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        flex-grow: 1;
      }

      #toggle-toolbar-btn {
        background-color: var(--terracotta);
        color: var(--espresso);
        border: 1px solid var(--espresso);
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
      }

      #drawing-toolbar.closed-pc {
        transform: none;
        left: 8px;
        top: 12px;
        bottom: auto;
        width: 46px !important;
        height: 46px;
        padding: 0 !important;
        overflow: visible !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }

      #drawing-toolbar.closed-pc .toolbar-body,
      #drawing-toolbar.closed-pc header {
        display: none !important;
      }

      #drawing-toolbar.closed-pc #toggle-toolbar-btn {
        position: relative;
        inset: auto;
        width: 46px;
        height: 46px;
        margin: 0;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(74, 59, 50, 0.2);
      }

      #drawing-toolbar header {
        padding-left: 36px;
        padding-right: 5px;
      }

      .tool-section {
        padding: 6px 0;
        border-top: 1px solid rgba(74, 59, 50, 0.16);
      }

      .tool-section-title {
        display: block;
        margin-bottom: 4px;
        color: var(--espresso);
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.05em;
      }

      .btn-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .wide-btn {
        grid-column: 1 / -1;
      }

      button {
        background-color: var(--espresso);
        color: var(--cream);
        border: 1px solid var(--espresso);
        padding: 8px 6px;
        font-size: 0.75rem;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.1s,
          background-color 0.2s,
          border-color 0.2s;
      }

      button:not(.color-btn):not(.bg-color-btn):hover {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
        color: var(--espresso);
      }
      button:active {
        transform: scale(0.95);
      }

      #save-btn,
      #start-btn,
      #battle-start-action-btn,
      #retry-battle-btn {
        background-color: var(--terracotta);
        border-color: var(--terracotta);
        color: var(--espresso);
      }
      #save-btn:hover,
      #start-btn:hover,
      #battle-start-action-btn:hover,
      #retry-battle-btn:hover {
        background-color: var(--espresso);
        border-color: var(--espresso);
        color: var(--cream);
      }
      #reset-btn {
        background-color: transparent;
        color: var(--espresso);
      }

      .draw-mode-switch {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-bottom: 4px;
        padding: 2px;
        border: 1px solid rgba(101, 89, 90, 0.16);
        border-radius: 10px;
        background: rgba(232, 183, 177, 0.18);
      }

      .draw-mode-btn {
        background: transparent;
        color: var(--espresso);
        border-color: transparent;
        box-shadow: none;
        padding: 5px;
      }

      .draw-mode-btn.is-active {
        background: var(--cream);
        color: var(--espresso);
        border-color: rgba(101, 89, 90, 0.14);
        box-shadow: 0 2px 6px rgba(101, 89, 90, 0.12);
      }

      .color-palette {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 4px;
        padding: 2px;
      }

      .color-btn,
      .bg-color-btn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--cream);
        box-shadow: 0 1px 3px rgba(74, 59, 50, 0.22);
        cursor: pointer;
        padding: 0;
        transition: transform 0.1s;
      }

      .color-btn.active,
      .bg-color-btn.active {
        border-color: var(--espresso);
        transform: scale(1.1);
      }
      .color-btn.white-color,
      .bg-color-btn.white-color {
        border-color: rgba(74, 59, 50, 0.48);
      }

      .pen-cursor {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>')
            2 22,
          crosshair !important;
      }

      .eraser-cursor {
        cursor:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="none" stroke="black" stroke-width="1"/></svg>')
            10 10,
          auto !important;
      }

      .fill-cursor {
        cursor: auto !important;
      }

      .battle-cursor {
        cursor: auto !important;
      }

      #library-container {
        background: rgba(255, 255, 255, 0.32);
        padding: 5px;
        border-radius: 8px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        max-height: 110px;
        overflow-y: auto;
        min-height: 50px;
        border: 1px solid rgba(74, 59, 50, 0.16);
      }

      .library-wrapper {
        position: relative;
        display: block;
        min-width: 0;
      }

      .library-item {
        width: 100%;
        height: 48px;
        box-sizing: border-box;
        border: 1px solid rgba(101, 89, 90, 0.35);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.46);
        object-fit: contain;
      }

      .lib-action-btns {
        position: absolute;
        top: -5px;
        right: -5px;
        display: none;
        gap: 2px;
        z-index: 10;
      }

      .library-wrapper:hover .lib-action-btns,
      .library-wrapper:active .lib-action-btns {
        display: flex;
      }

      .lib-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: none;
        color: white;
        font-size: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }

      .lib-edit-btn {
        background-color: var(--espresso);
      }
      .lib-del-btn {
        background-color: var(--terracotta);
        color: var(--espresso);
      }

      .library-placeholder {
        font-size: 0.65rem;
        color: var(--espresso);
        opacity: 0.62;
        text-align: center;
        width: 100%;
        grid-column: 1 / -1;
        align-self: center;
      }

      .wandering-creature {
        position: absolute;
        will-change: transform;
        z-index: 9999;
        pointer-events: none;
        transform-origin: center bottom;
        transition: opacity 0.3s ease;
      }

      .snack-item {
        position: absolute;
        width: 52px;
        height: 52px;
        font-size: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        0% {
          transform: translate(-50%, -50%) scale(0);
        }
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
      }

      /* バトルモード専用演出・HUD */
      #battle-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 3;
        display: none;
      }

      #battle-hud {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3600;
        display: none;
        gap: 12px;
        align-items: center;
        background: rgba(255, 248, 243, 0.92);
        padding: 10px 20px;
        border-radius: 24px;
        border: 2px solid var(--espresso);
        box-shadow: 0 6px 20px rgba(74, 59, 50, 0.25);
      }

      #battle-status-text {
        font-weight: bold;
        color: var(--espresso);
        font-size: 1rem;
        letter-spacing: 0.05em;
      }

      /* ポップアップ擬音・リザルト演出エフェクト */
      .battle-pop-effect {
        position: absolute;
        z-index: 9999;
        font-weight: bold;
        color: var(--terracotta);
        -webkit-text-stroke: 1px var(--espresso);
        font-size: 1.4rem;
        pointer-events: none;
        animation: floatUpPop 0.8s ease-out forwards;
      }

      @keyframes floatUpPop {
        0% {
          transform: translate(-50%, -50%) scale(0.5);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -120%) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -180%) scale(1);
          opacity: 0;
        }
      }

      @media (max-width: 768px) {
        #drawing-toolbar {
          top: auto;
          right: max(8px, env(safe-area-inset-right));
          left: max(8px, env(safe-area-inset-left));
          bottom: max(8px, env(safe-area-inset-bottom));
          width: auto;
          max-height: min(52vh, 420px);
          padding: 8px 10px;
          border-radius: 16px;
          display: flex;
          flex-direction: column;
          transform: none !important;
        }

        #drawing-toolbar.closed-mobile {
          max-height: 44px !important;
          max-width: 44px !important;
          min-height: 0 !important;
          width: 44px !important;
          height: 44px !important;
          overflow: visible !important;
          padding: 0 !important;
          left: auto !important;
          right: max(8px, env(safe-area-inset-right)) !important;
          bottom: max(8px, env(safe-area-inset-bottom)) !important;
          top: auto !important;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
        }
        #drawing-toolbar.closed-mobile .toolbar-body,
        #drawing-toolbar.closed-mobile header {
          display: none !important;
        }
        #drawing-toolbar.closed-mobile #toggle-toolbar-btn {
          top: auto !important;
          right: 0 !important;
          left: auto !important;
          bottom: 0 !important;
          width: 44px !important;
          height: 44px !important;
          border-radius: 12px;
          box-shadow: 0 3px 10px rgba(74, 59, 50, 0.2);
        }

        #drawing-toolbar header {
          order: -1;
          margin-bottom: 2px;
          padding-left: 5px;
          padding-right: 42px;
        }

        #toggle-toolbar-btn {
          top: 8px;
          right: 8px;
          left: auto;
        }

        /* スマホ用バトルHUD・ギャラリー追加対応 */
        #battle-hud {
          width: 90%;
          box-sizing: border-box;
          flex-wrap: wrap;
          padding: 8px 12px;
          gap: 8px;
        }
        #battle-status-text {
          font-size: 0.9rem;
          width: 100%;
          text-align: center;
        }
        #battle-hud button {
          flex: 1;
          font-size: 0.75rem;
          padding: 8px 5px;
          margin: 0;
        }
        .adult-gallery {
          grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
          gap: 10px;
        }
        .adult-card img {
          width: 80px;
          height: 80px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 右上ハンバーガーメニューボタン -->
    <button id="hamburger-btn" aria-label="メニュー">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- ハンバーガーメニューモーダル -->
    <div id="menu-modal">
      <div class="menu-content">
        <h2>もーど せんたく</h2>
        <button class="menu-btn" id="to-draw-mode">おえかきモード</button>
        <button class="menu-btn" id="to-battle-mode">バトルモード</button>
        <button class="menu-btn" id="to-adult-mode">おとなようモード</button>
        <button class="menu-btn" id="close-menu-btn">とじる</button>
      </div>
    </div>

    <!-- バトルモード設定画面 -->
    <div id="battle-setup-screen">
      <div class="adult-header">
        <h2>バトルモード キャラクターせんたく</h2>
        <div class="adult-header-actions">
          <button id="battle-start-action-btn">バトルスタート！</button>
          <button id="close-battle-setup">もどる</button>
        </div>
      </div>
      <p
        style="
          text-align: center;
          margin-bottom: 15px;
          color: var(--espresso);
          font-weight: bold;
        "
      >
        バトルに さんかさせたい キャラクターを えらんでね
      </p>
      <div id="battle-gallery" class="adult-gallery"></div>
    </div>

    <!-- おとなようモード / 一覧画面 -->
    <div id="adult-mode-screen">
      <div class="adult-header">
        <h2 id="gallery-title-text">保存した絵のギャラリー</h2>
        <div class="adult-header-actions">
          <div id="adult-batch-download-container"></div>
          <button id="close-adult-mode">もどる</button>
        </div>
      </div>
      <div id="adult-gallery" class="adult-gallery"></div>
    </div>

    <!-- キャンバス背景＆描画キャンバス -->
    <div id="canvas-bg"></div>
    <canvas id="draw-canvas" class="pen-cursor"></canvas>
    <canvas id="battle-canvas"></canvas>

    <!-- バトル中HUD -->
    <div id="battle-hud" class="interactive">
      <span id="battle-status-text">バトルちゅう！おしだせ！</span>
      <button id="retry-battle-btn" style="display: none">
        もういちど バトルする
      </button>
      <button id="back-to-select-btn" style="display: none">
        キャラクター せんたく
      </button>
      <button id="exit-battle-btn">バトルを おわる</button>
    </div>

    <div id="ui-layer">
      <aside
        id="drawing-toolbar"
        class="interactive"
        aria-label="おえかきツール"
      >
        <button
          id="toggle-toolbar-btn"
          type="button"
          aria-expanded="true"
          aria-controls="toolbar-body"
          aria-label="おえかきツールをとじる"
          title="おえかきツールをとじる"
        >
          ◀
        </button>

        <header>
          <h1>うろちょろメーカー</h1>
          <p>かく、ほぞんする、うごかす</p>
        </header>

        <div class="toolbar-body" id="toolbar-body">
          <section class="tool-section" aria-labelledby="draw-tools-title">

    <script>
      const canvas = document.getElementById("draw-canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const startBtn = document.getElementById("start-btn");
      const clearBtn = document.getElementById("clear-btn");

      const saveBtn = document.getElementById("save-btn");

      const libraryContainer = document.getElementById("library-container");
      const colorBtns = document.querySelectorAll(".color-btn");

      const bgColorBtns = document.querySelectorAll(".bg-color-btn");
      const selectBgPhotoBtn = document.getElementById("select-bg-photo-btn");
      const bgFileInput = document.getElementById("bg-file-input");

      const drawingToolbar = document.getElementById("drawing-toolbar");
      const toggleToolbarBtn = document.getElementById("toggle-toolbar-btn");
      let isToolbarOpen = true;

      function updateToolbarToggleUI() {
        const isMobile = window.innerWidth <= 768;
        drawingToolbar.classList.remove("closed-pc", "closed-mobile");
        if (isToolbarOpen) {
          toggleToolbarBtn.textContent = isMobile ? "▼" : "◀";
          toggleToolbarBtn.setAttribute("aria-label", "おえかきツールをとじる");
          toggleToolbarBtn.setAttribute("title", "おえかきツールをとじる");
          toggleToolbarBtn.setAttribute("aria-expanded", "true");
        } else {
          drawingToolbar.classList.add(
            isMobile ? "closed-mobile" : "closed-pc",
          );
          toggleToolbarBtn.textContent = isMobile ? "▲" : "▶";
          toggleToolbarBtn.setAttribute("aria-label", "おえかきツールをひらく");
          toggleToolbarBtn.setAttribute("title", "おえかきツールをひらく");
          toggleToolbarBtn.setAttribute("aria-expanded", "false");
        }
      }

      toggleToolbarBtn.addEventListener("click", () => {
        isToolbarOpen = !isToolbarOpen;
        updateToolbarToggleUI();
      });

      window.addEventListener("resize", updateToolbarToggleUI);
      updateToolbarToggleUI();

      const hamburgerBtn = document.getElementById("hamburger-btn");
      const menuModal = document.getElementById("menu-modal");
      const closeMenuBtn = document.getElementById("close-menu-btn");
      const toDrawModeBtn = document.getElementById("to-draw-mode");
      const openGalleryBtn = document.getElementById("open-gallery-btn");
      const toAdultModeBtn = document.getElementById("to-adult-mode");
      const adultModeScreen = document.getElementById("adult-mode-screen");
      const closeAdultModeBtn = document.getElementById("close-adult-mode");
      const adultGallery = document.getElementById("adult-gallery");
      const galleryTitleText = document.getElementById("gallery-title-text");
      const adultBatchDownloadContainer = document.getElementById(
        "adult-batch-download-container",
      );

      // バトルモード関連要素
      const toBattleModeBtn = document.getElementById("to-battle-mode");
      const battleSetupScreen = document.getElementById("battle-setup-screen");
      const closeBattleSetupBtn = document.getElementById("close-battle-setup");
      const battleGallery = document.getElementById("battle-gallery");
      const battleStartActionBtn = document.getElementById(
        "battle-start-action-btn",
      );
      const battleCanvas = document.getElementById("battle-canvas");
      const battleCtx = battleCanvas.getContext("2d");
      const battleHud = document.getElementById("battle-hud");
      const exitBattleBtn = document.getElementById("exit-battle-btn");
      const retryBattleBtn = document.getElementById("retry-battle-btn");
      const backToSelectBtn = document.getElementById("back-to-select-btn");
      const battleStatusText = document.getElementById("battle-status-text");

      let creatures = [];
      let battleCreatures = [];
      let isBattleActive = false;
      let battleField = { x: 0, y: 0, radius: 0 };
      let lastSelectedImages = [];
      let battleAnimationId = null;

      let currentColor = "#000000";
      let drawMode = "pen";
      let isPaused = false;

      let snackModeActive = false;
      const snackModeBtn = document.getElementById("snack-mode-btn");
      let activeSnacks = [];

      snackModeBtn.addEventListener("click", () => {
        snackModeActive = !snackModeActive;
        if (snackModeActive) {
          snackModeBtn.textContent = "おやつをあげる";
          snackModeBtn.style.backgroundColor = "var(--terracotta)";
          snackModeBtn.style.color = "var(--espresso)";
          canvas.className = "fill-cursor";
        } else {
          snackModeBtn.textContent = "おやつをあげる";
          snackModeBtn.style.backgroundColor = "var(--espresso)";
          snackModeBtn.style.color = "var(--cream)";
          activeSnacks.forEach((s) => s.element.remove());
          activeSnacks = [];

          if (drawMode === "pen") canvas.className = "pen-cursor";
          else if (drawMode === "eraser") canvas.className = "eraser-cursor";
          else canvas.className = "fill-cursor";
        }
      });

      let undoStack = [];
      const maxUndoSteps = 20;

      function saveState() {
        if (undoStack.length >= maxUndoSteps) {
          undoStack.shift();
        }
        undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      }

      hamburgerBtn.addEventListener("click", () => {
        menuModal.classList.add("open");
      });

      closeMenuBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
      });

      toDrawModeBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
        adultModeScreen.classList.remove("open");
        battleSetupScreen.classList.remove("open");
        if (isBattleActive) {
          endBattleMode();
        }
      });

      function openGalleryView() {
        menuModal.classList.remove("open");
        galleryTitleText.textContent = "保存した絵の一覧";
        renderAdultGallery(true);
        adultModeScreen.classList.add("open");
      }

      openGalleryBtn.addEventListener("click", openGalleryView);

      toAdultModeBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
        galleryTitleText.textContent = "おとなようモード（画像保存管理）";
        renderAdultGallery(false);
        adultModeScreen.classList.add("open");
      });

      closeAdultModeBtn.addEventListener("click", () => {
        adultModeScreen.classList.remove("open");
      });

      toBattleModeBtn.addEventListener("click", () => {
        menuModal.classList.remove("open");
        renderBattleGallery();
        battleSetupScreen.classList.add("open");
      });

      closeBattleSetupBtn.addEventListener("click", () => {
        battleSetupScreen.classList.remove("open");
      });

      exitBattleBtn.addEventListener("click", () => {
        endBattleMode();
      });

      retryBattleBtn.addEventListener("click", () => {
        if (lastSelectedImages.length >= 2) {
          startBattleMode(lastSelectedImages);
        }
      });

      backToSelectBtn.addEventListener("click", () => {
        endBattleMode();
        renderBattleGallery();
        battleSetupScreen.classList.add("open");
      });

      function renderBattleGallery() {
        battleGallery.innerHTML = "";
        const images = readSavedImages();
        if (images.length === 0) {
          battleGallery.innerHTML =
            '<p style="grid-column: 1/-1; text-align: center; color: var(--espresso);">バトルに さんか できる キャラクターが いません。まず えを ほぞん してね！</p>';
          return;
        }

        images.forEach((imgInfo, index) => {
          const card = document.createElement("div");
          card.className = "adult-card";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = false;
          checkbox.addEventListener("change", (e) => {
            e.stopPropagation();
            if (checkbox.checked) {
              card.classList.add("selected");
            } else {
              card.classList.remove("selected");
            }
          });
          card.addEventListener("click", (e) => {
            if (e.target !== checkbox) {
              checkbox.checked = !checkbox.checked;
              checkbox.dispatchEvent(new Event("change"));
            }
          });
          card.appendChild(checkbox);

          const img = document.createElement("img");
          img.src = imgInfo.dataUrl;
          card.appendChild(img);

          const label = document.createElement("span");
          label.style.fontSize = "0.75rem";
          label.style.fontWeight = "bold";
          label.style.color = "var(--espresso)";
          label.textContent = `ファイター #${index + 1}`;
          card.appendChild(label);

          battleGallery.appendChild(card);
        });
      }

      battleStartActionBtn.addEventListener("click", () => {
        const cards = battleGallery.querySelectorAll(".adult-card");
        const images = readSavedImages();
        const selectedImages = [];

        cards.forEach((card, idx) => {
          const cb = card.querySelector("input[type='checkbox']");
          if (cb && cb.checked && images[idx]) {
            selectedImages.push(images[idx]);
          }
        });

        if (selectedImages.length < 2) {
          alert("バトルには 2たい いじょうの キャラクターを えらんでね！");
          return;
        }

        lastSelectedImages = selectedImages;
        battleSetupScreen.classList.remove("open");
        startBattleMode(selectedImages);
      });

      function startBattleMode(selectedImages) {
        screenResetBtn.click();
        isBattleActive = true;

        drawingToolbar.classList.add("battle-hidden");
        canvas.className = "battle-cursor";

        battleCanvas.style.display = "block";
        battleHud.style.display = "flex";
        battleStatusText.textContent = "バトルちゅう！おしだせ！";
        retryBattleBtn.style.display = "none";
        backToSelectBtn.style.display = "none";
        exitBattleBtn.style.display = "inline-block";

        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        const radius = Math.min(cx, cy) * 0.72;
        battleField = { x: cx, y: cy, radius: radius };

        drawBattleField();

        battleCreatures = selectedImages.map((imgInfo, idx) => {
          const angle = (idx / selectedImages.length) * Math.PI * 2;

          const pixelArea = imgInfo.width * imgInfo.height;
          const scaleFactor = Math.min(
            1.2,
            Math.max(0.5, Math.sqrt(pixelArea) / 90),
          );
          const baseSize = 65 * scaleFactor;

          let width, height;
          if (imgInfo.width >= imgInfo.height) {
            width = baseSize;
            height = baseSize * (imgInfo.height / imgInfo.width);
          } else {
            height = baseSize;
            width = baseSize * (imgInfo.width / imgInfo.height);
          }

          const spawnDist = radius * 0.75;
          const px = cx + Math.cos(angle) * spawnDist - width / 2;
          const py = cy + Math.sin(angle) * spawnDist - height / 2;

          const creature = document.createElement("img");
          creature.src = imgInfo.dataUrl;
          creature.className = "wandering-creature";

          creature.style.width = width + "px";
          creature.style.height = height + "px";
          creature.style.objectFit = "contain";
          document.body.appendChild(creature);

          // キャラクターごとの動きの個性（ランダムな重みや敏捷性）
          const personalitySeed = Math.random();

          return {
            element: creature,
            x: px,
            y: py,
            width: width,
            height: height,
            mass: scaleFactor * 2.5,
            speedX: (Math.random() - 0.5) * 3.0,
            speedY: (Math.random() - 0.5) * 3.0,
            personality: personalitySeed, // 動きをキャラごとに変化させるためのパラメータ
            isAlive: true,
            victoryTimer: 0,
          };
        });

        if (battleAnimationId) {
          cancelAnimationFrame(battleAnimationId);
          battleAnimationId = null;
        }
        battleAnimationId = requestAnimationFrame(updateBattle);
      }

      function drawBattleField() {
        battleCanvas.width = window.innerWidth;
        battleCanvas.height = window.innerHeight;
        battleCtx.clearRect(0, 0, battleCanvas.width, battleCanvas.height);

        battleCtx.save();
        battleCtx.fillStyle = "rgba(74, 59, 50, 0.22)";
        battleCtx.fillRect(0, 0, battleCanvas.width, battleCanvas.height);

        battleCtx.globalCompositeOperation = "destination-out";
        battleCtx.beginPath();
        battleCtx.arc(
          battleField.x,
          battleField.y,
          battleField.radius,
          0,
          Math.PI * 2,
        );
        battleCtx.fill();
        battleCtx.restore();

        battleCtx.save();
        battleCtx.beginPath();
        battleCtx.arc(
          battleField.x,
          battleField.y,
          battleField.radius,
          0,
          Math.PI * 2,
        );
        battleCtx.strokeStyle = "var(--espresso)";
        battleCtx.lineWidth = 8;
        battleCtx.stroke();

        battleCtx.beginPath();
        battleCtx.arc(
          battleField.x,
          battleField.y,
          battleField.radius - 6,
          0,
          Math.PI * 2,
        );
        battleCtx.strokeStyle = "var(--terracotta)";
        battleCtx.lineWidth = 3;
        battleCtx.stroke();
        battleCtx.restore();
      }

      function showPopupEffect(text, x, y) {
        const el = document.createElement("div");
        el.className = "battle-pop-effect";
        el.textContent = text;
        el.style.left = x + "px";
        el.style.top = x ? y + "px" : "0px";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
      }

      function updateBattle() {
        if (!isBattleActive) return;

        drawBattleField();

        const activeAliveList = battleCreatures.filter((c) => c.isAlive);

        if (activeAliveList.length <= 1 && battleCreatures.length > 1) {
          if (activeAliveList.length === 1) {
            const winner = activeAliveList[0];

            winner.speedX = 0;
            winner.speedY = 0;

            winner.victoryTimer += 0.08;
            const pulse = 1 + Math.sin(winner.victoryTimer * 5) * 0.35;
            const scaleXFactor = winner.speedX < 0 ? -1 : 1;
            winner.element.style.transform = `translate(${winner.x}px, ${winner.y}px) scaleX(${scaleXFactor}) scale(${pulse})`;

            battleStatusText.textContent = `かったね おめでとう！`;
            retryBattleBtn.style.display = "inline-block";
            backToSelectBtn.style.display = "inline-block";
            exitBattleBtn.style.display = "none";

            if (winner.victoryTimer < 0.1) {
              showPopupEffect(
                "はっけよいのこった！",
                battleField.x,
                battleField.y - 50,
              );
            }
            battleAnimationId = requestAnimationFrame(updateBattle);
            return;
          } else {
            isBattleActive = false;
            battleStatusText.textContent = `おみごと！りょうしゃドロー！`;
            retryBattleBtn.style.display = "inline-block";
            backToSelectBtn.style.display = "inline-block";
            exitBattleBtn.style.display = "none";
            return;
          }
        }

        battleCreatures.forEach((c) => {
          if (!c.isAlive) return;

          c.x += c.speedX;
          c.y += c.speedY;

          let target = null;
          let minTargetDist = Infinity;
          activeAliveList.forEach((other) => {
            if (other === c) return;
            const ox = other.x + other.width / 2;
            const oy = other.y + other.height / 2;
            const cx = c.x + c.width / 2;
            const cy = c.y + c.height / 2;
            const dist = Math.hypot(ox - cx, oy - cy);
            if (dist < minTargetDist) {
              minTargetDist = dist;
              target = other;
            }
          });

          if (target) {
            const tx = target.x + target.width / 2;
            const ty = target.y + target.height / 2;
            const cx = c.x + c.width / 2;
            const cy = c.y + c.height / 2;
            const angleToTarget = Math.atan2(ty - cy, tx - cx);

            // キャラクターごとに動きのランダム性（突撃の強さや不規則な蛇行）を加える
            const rushForce = 0.25 + c.personality * 0.3;
            const wobble =
              Math.sin(Date.now() * 0.01 + c.personality * 10) * 0.8;

            c.speedX += Math.cos(angleToTarget + wobble) * rushForce;
            c.speedY += Math.sin(angleToTarget + wobble) * rushForce;
          }

          const currentSpd = Math.hypot(c.speedX, c.speedY);
          const maxSpd = 11.5;
          if (currentSpd > maxSpd) {
            c.speedX = (c.speedX / currentSpd) * maxSpd;
            c.speedY = (c.speedY / currentSpd) * maxSpd;
          }

          c.speedX *= 0.985;
          c.speedY *= 0.985;

          const centerX = c.x + c.width / 2;
          const centerY = c.y + c.height / 2;
          const distFromCenter = Math.hypot(
            centerX - battleField.x,
            centerY - battleField.y,
          );

          battleCreatures.forEach((other) => {
            if (other === c || !other.isAlive) return;

            const otherCenterX = other.x + other.width / 2;
            const otherCenterY = other.y + other.height / 2;
            const dx = otherCenterX - centerX;
            const dy = otherCenterY - centerY;
            const distance = Math.hypot(dx, dy);
            const minDist = (c.width + other.width) / 2.3;

            if (distance < minDist && distance > 0) {
              const overlap = minDist - distance;
              const angle = Math.atan2(dy, dx);

              const totalMass = c.mass + other.mass;
              const ratioC = other.mass / totalMass;
              const ratioOther = c.mass / totalMass;

              c.x -= Math.cos(angle) * overlap * ratioC;
              c.y -= Math.sin(angle) * overlap * ratioC;
              other.x += Math.cos(angle) * overlap * ratioOther;
              other.y += Math.sin(angle) * overlap * ratioOther;

              // 1対1になった際などの直線の往復膠着を防ぐため、ランダム性と強力なはじき飛ばし力を加える
              const isTwoFighters = activeAliveList.length === 2;
              const randomMultiplier = 0.4 + Math.random() * 4.2; // 爆発的なランダム係数
              const pushPower = (isTwoFighters ? 16.0 : 9.0) * randomMultiplier;

              // 中央付近であっても枠外まで勢いよく飛び出すバリエーションを持たせる
              c.speedX = c.speedX * 0.02 - Math.cos(angle) * pushPower;
              c.speedY = c.speedY * 0.02 - Math.sin(angle) * pushPower;
              other.speedX = other.speedX * 0.02 + Math.cos(angle) * pushPower;
              other.speedY = other.speedY * 0.02 + Math.sin(angle) * pushPower;

              if (Math.random() < 0.2) {
                const sounds = isTwoFighters
                  ? [
                      "きょうれつないちげき！",
                      "ふきとんだ！",
                      "いちもうだじん！",
                      "ドッカーン！",
                      "げきとつ！！",
                    ]
                  : ["どすこい！", "バキッ！", "それっ！", "うおおっ！"];
                showPopupEffect(
                  sounds[Math.floor(Math.random() * sounds.length)],
                  centerX,
                  centerY,
                );
              }
            }
          });

          let scaleXFactor = c.speedX < 0 ? -1 : 1;
          c.element.style.transform = `translate(${c.x}px, ${c.y}px) scaleX(${scaleXFactor})`;

          if (distFromCenter > battleField.radius) {
            c.isAlive = false;
            c.element.remove();
            showPopupEffect("リタイア！", centerX, centerY);
          }
        });

        battleAnimationId = requestAnimationFrame(updateBattle);
      }

      function resizeCanvas() {
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        if (canvas.width > 0 && canvas.height > 0)
          tempCtx.drawImage(canvas, 0, 0);

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.drawImage(tempCanvas, 0, 0);

        ctx.strokeStyle =
          drawMode === "eraser" ? "rgba(0,0,0,1)" : currentColor;
        ctx.fillStyle = currentColor;
        ctx.lineWidth = drawMode === "eraser" ? 20 : 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (undoStack.length === 0) saveState();
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function getEventPos(e) {
        const touch = e.touches && e.touches.length > 0 ? e.touches[0] : null;
        return {
          x: Number.isFinite(e.clientX)
            ? e.clientX
            : touch
              ? touch.clientX
              : null,
          y: Number.isFinite(e.clientY)
            ? e.clientY
            : touch
              ? touch.clientY
              : null,
        };
      }

      function handleCanvasDown(e) {
        if (isBattleActive) return;

        const pos = getEventPos(e);
        if (!Number.isFinite(pos.x) || !Number.isFinite(pos.y)) return;

        if (snackModeActive) {
          e.preventDefault();
          spawnSnack(pos.x, pos.y);
          return;
        }

        saveState();
        if (drawMode === "fill") {
          e.preventDefault();
          floodFill(Math.floor(pos.x), Math.floor(pos.y), currentColor);
        } else {
          isDrawing = true;
          [lastX, lastY] = [pos.x, pos.y];
        }
      }

      function handleCanvasMove(e) {
        if (isBattleActive || !isDrawing || drawMode === "fill") return;
        e.preventDefault();
        const pos = getEventPos(e);

        ctx.save();
        if (drawMode === "eraser") {
          ctx.globalCompositeOperation = "destination-out";
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = currentColor;
        }
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.restore();

        [lastX, lastY] = [pos.x, pos.y];
      }

      function stopDrawing() {
        isDrawing = false;
      }

      function floodFill(startX, startY, fillColorHex) {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        const targetColor = getPixel(data, startX, startY, canvas.width);
        const fillColor = hexToRgba(fillColorHex);
        if (colorsMatch(targetColor, fillColor)) return;

        const queue = [[startX, startY]];
        const width = canvas.width;
        const height = canvas.height;

        while (queue.length > 0) {
          const [x, y] = queue.pop();
          if (x < 0 || x >= width || y < 0 || y >= height) continue;
          if (colorsMatch(getPixel(data, x, y, width), targetColor)) {
            setPixel(data, x, y, width, fillColor);
            queue.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      function getPixel(data, x, y, width) {
        const idx = (y * width + x) * 4;
        return [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
      }
      function setPixel(data, x, y, width, color) {
        const idx = (y * width + x) * 4;
        data[idx] = color[0];
        data[idx + 1] = color[1];
        data[idx + 2] = color[2];
        data[idx + 3] = color[3];
      }
      function colorsMatch(a, b) {
        return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
      }
      function hexToRgba(hex) {
        let c = hex.replace("#", "");
        if (c.length === 3)
          c = c
            .split("")
            .map((x) => x + x)
            .join("");
        const num = parseInt(c, 16);
        return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
      }

      canvas.addEventListener("mousedown", handleCanvasDown);
      canvas.addEventListener("mousemove", handleCanvasMove);
      canvas.addEventListener("mouseup", stopDrawing);
      canvas.addEventListener("mouseout", stopDrawing);
      canvas.addEventListener("touchstart", handleCanvasDown, {
        passive: false,
      });
      canvas.addEventListener("touchmove", handleCanvasMove, {
        passive: false,
      });
      canvas.addEventListener("touchend", stopDrawing);

      function getCroppedImage() {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        let minX = canvas.width,
          minY = canvas.height,
          maxX = 0,
          maxY = 0;
        let found = false;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            if (data[(y * canvas.width + x) * 4 + 3] > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }
        if (!found) return null;

        const pad = 10;
        minX = Math.max(0, minX - pad);
        minY = Math.max(0, minY - pad);
        maxX = Math.min(canvas.width, maxX + pad);
        maxY = Math.min(canvas.height, maxY + pad);
        const w = maxX - minX,
          h = maxY - minY;
        if (w < 2 || h < 2) return null;

        const cutCanvas = document.createElement("canvas");
        cutCanvas.width = w;
        cutCanvas.height = h;
        cutCanvas
          .getContext("2d")
          .drawImage(canvas, minX, minY, w, h, 0, 0, w, h);
        return { dataUrl: cutCanvas.toDataURL(), width: w, height: h };
      }

            (i) =>
              i &&
              typeof i.dataUrl === "string" &&
              i.dataUrl.startsWith("data:image/"),
          );
        } catch (e) {
          return [];
        }
      }

      function spawnSnack(x, y) {
        const snacks = ["🍎", "🍪", "🍩", "🍓", "🍉", "🍬"];

      function spawnCreature(dataUrl, origWidth, origHeight) {
        const creature = document.createElement("img");
        creature.src = dataUrl;
        creature.className = "wandering-creature";

        const baseSize = 90;
        let scaleMultiplier = 1.0;
        let width, height;

        function updateSize() {
          if (origWidth >= origHeight) {
            width = baseSize * scaleMultiplier;
            height = baseSize * (origHeight / origWidth) * scaleMultiplier;
          } else {
            height = baseSize * scaleMultiplier;
            width = baseSize * (origWidth / origHeight) * scaleMultiplier;
          }
          creature.style.width = width + "px";
          creature.style.height = height + "px";
        }
        updateSize();
        document.body.appendChild(creature);

        let posX = Math.random() * (window.innerWidth - width);
        let posY = Math.random() * (window.innerHeight - height);
        
        // 修正: キャラクターのスピードを少し遅くする (係数を6から3に変更)
        let speedX = (Math.random() - 0.5) * 3;
        let speedY = (Math.random() - 0.5) * 3;
        
        // 修正: バグ修正含め、最低限のスピードを1前後に設定
        if (Math.abs(speedX) < 1) speedX = speedX < 0 ? -1 : 1;
        if (Math.abs(speedY) < 1) speedY = speedY < 0 ? -1 : 1;

        let stepCount = Math.random() * 100;
        const creatureObj = {
          element: creature,
          get x() {
            return posX;
          },
          set x(v) {
            posX = v;
          },
          get y() {
            return posY;
          },
          set y(v) {
            posY = v;
          },
          get width() {
            return width;
          },
          get height() {
            return height;
          },
          get speedX() {
            return speedX;
          },
          set speedX(v) {
            speedX = v;
          },
          get speedY() {
            return speedY;
          },
          set speedY(v) {
            speedY = v;
          },
          isRunning: !isPaused,
          animationId: null,
          remove() {
            this.isRunning = false;
            if (this.animationId) cancelAnimationFrame(this.animationId);
            creatures = creatures.filter((c) => c !== this);
            creature.remove();
          },
        };

        creatures.push(creatureObj);

        function animate() {
          if (!creatureObj.isRunning) return;

          if (activeSnacks.length > 0) {
            let closestSnack = null,
              minDist = Infinity;
            for (let snack of activeSnacks) {
              const dist = Math.hypot(
                snack.x - width / 2 - posX,
                snack.y - height / 2 - posY,
              );
              if (dist < minDist) {
                minDist = dist;
                closestSnack = snack;
              }
            }
            if (closestSnack) {
              const dx = closestSnack.x - width / 2 - posX;
              const dy = closestSnack.y - height / 2 - posY;
              const dist = Math.hypot(dx, dy);
              if (dist < 15) {
                scaleMultiplier = Math.min(2.5, scaleMultiplier + 0.15);
                updateSize();
                closestSnack.element.remove();
                activeSnacks = activeSnacks.filter((s) => s !== closestSnack);
              } else {
                speedX += (dx / dist) * 0.3;
                speedY += (dy / dist) * 0.3;
                const spd = Math.hypot(speedX, speedY);
                // 修正: おやつへ向かうスピードの制限を少し遅くする (3.5から2.0)
                if (spd > 2.0) {
                  speedX = (speedX / spd) * 2.0;
                  speedY = (speedY / spd) * 2.0;
                }
              }
            }
          }

          posX += speedX;
          posY += speedY;

          // キャラクター同士の衝突反発処理
          creatures.forEach((other) => {
            if (other === creatureObj) return;
            const dx = other.x + other.width / 2 - (posX + width / 2);
            const dy = other.y + other.height / 2 - (posY + height / 2);
            const distance = Math.hypot(dx, dy);
            const minDist = (width + other.width) / 2.3;

            if (distance < minDist && distance > 0) {
              const overlap = minDist - distance;
              const angle = Math.atan2(dy, dx);

              // 位置を押し戻す
              posX -= Math.cos(angle) * overlap * 0.5;
              posY -= Math.sin(angle) * overlap * 0.5;

              // 速度を反発させる
              const tempSpeedX = speedX;
              const tempSpeedY = speedY;
              speedX = other.speedX * 0.8 - Math.cos(angle) * 2;
              speedY = other.speedY * 0.8 - Math.sin(angle) * 2;
              other.speedX = tempSpeedX * 0.8 + Math.cos(angle) * 2;
              other.speedY = tempSpeedY * 0.8 + Math.sin(angle) * 2;
            }
          });

          stepCount += 0.2;
          let tilt = Math.sin(stepCount) * 15;
          let scaleX = speedX < 0 ? -1 : 1;

          if (posX <= 0 || posX + width >= window.innerWidth) {
            speedX *= -1;
            posX = Math.max(0, Math.min(posX, window.innerWidth - width));
          }
          if (posY <= 0 || posY + height >= window.innerHeight) {
            speedY *= -1;
            posY = Math.max(0, Math.min(posY, window.innerHeight - height));
          }

          creature.style.transform = `translate(${posX}px, ${posY}px) scaleX(${scaleX}) rotate(${tilt}deg)`;
          creatureObj.animationId = requestAnimationFrame(animate);
        }

        creatureObj.animationId = requestAnimationFrame(animate);
      }

      startBtn.addEventListener("click", () => {
        const thumbs = libraryContainer.querySelectorAll(".library-item");
        if (thumbs.length === 0) {
          alert("まずは えを かいて ほぞんしてね！");
          return;
        }
        thumbs.forEach((thumb) => {
          const img = new Image();
          img.src = thumb.src;
          img.onload = () =>
            spawnCreature(
              thumb.src,
              img.naturalWidth || img.width,
              img.naturalHeight || img.height,
            );
        });
      });

      stopBtn.addEventListener("click", () => {
        isPaused = !isPaused;
        creatures.forEach((c) => {
          c.isRunning = !isPaused;
          if (!isPaused) {
            function resume() {
              if (c.isRunning) c.animationId = requestAnimationFrame(resume);
            }
            c.animationId = requestAnimationFrame(resume);
          } else if (c.animationId) cancelAnimationFrame(c.animationId);
        });
        stopBtn.textContent = isPaused ? "さいかいする" : "とめる";
        stopBtn.style.backgroundColor = isPaused
          ? "var(--terracotta)"
          : "var(--espresso)";
        stopBtn.style.color = isPaused ? "var(--espresso)" : "var(--cream)";
      });

      screenResetBtn.addEventListener("click", () => {
        // creatures配列のコピーに対してremove()を呼び出して安全に全消去
        [...creatures].forEach((c) => c.remove());
        creatures = [];
        activeSnacks.forEach((s) => s.element.remove());
        activeSnacks = [];
        endBattleMode();
        isPaused = false;
        stopBtn.textContent = "とめる";
        stopBtn.style.backgroundColor = "var(--espresso)";
        stopBtn.style.color = "var(--cream)";
      });

      refreshAllLibraries();
    </script>
  </body>
</html>
